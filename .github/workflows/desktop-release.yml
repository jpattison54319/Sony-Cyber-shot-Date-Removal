name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            artifact: macos-apple-silicon
          - name: macOS Intel
            runner: macos-15-intel
            artifact: macos-intel
          - name: Windows x64
            runner: windows-2025
            artifact: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      DATE_STAMP_APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.1.0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            desktop/requirements-app.txt
            desktop/requirements-build.txt
            desktop/requirements-original-compat.txt
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.2.2
          python -m pip install -r desktop/requirements-app.txt -r desktop/requirements-build.txt
          python -m pip install --no-deps -r desktop/requirements-original-compat.txt
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r desktop/requirements-app.txt -r desktop/requirements-build.txt
          python -m pip install --no-deps -r desktop/requirements-original-compat.txt
          choco install innosetup --yes --no-progress
      - name: Test desktop batch layer
        shell: bash
        run: PYTHONPATH=desktop python -m unittest discover -s desktop/tests -v
      - name: Test original workflow
        shell: bash
        run: |
          cd reference/python-workflow
          python -m unittest discover -s tests -v
      - name: Build macOS installer
        if: runner.os == 'macOS'
        run: bash desktop/scripts/build_macos.sh
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: desktop/scripts/build_windows.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: desktop/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        working-directory: artifacts
        run: sha256sum *.dmg *.exe > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          artifacts/*.dmg
          artifacts/*.exe
          artifacts/SHA256SUMS.txt
          --repo "${GITHUB_REPOSITORY}"
          --title "Date Stamp Cleaner ${GITHUB_REF_NAME}"
          --generate-notes
