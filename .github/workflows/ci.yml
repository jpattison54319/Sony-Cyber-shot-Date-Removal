name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Install headless Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1
      - run: python -m pip install --requirement desktop/requirements-app.txt
      - run: PYTHONPATH=desktop python -m unittest discover -s desktop/tests -v
      - run: python -m compileall -q desktop/date_stamp_cleaner desktop/run_app.py
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run audit:privacy
      - run: npm run build
